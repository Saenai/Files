name: Build Sideload Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: microsoft/setup-msbuild@v2
      
      - name: Locate package projects
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter *.wapproj | Select-Object -ExpandProperty FullName
          
      - name: Build sideload package
        shell: pwsh
        run: |
          msbuild "src\Files.App (Package)\Files.Package.wapproj\Files.Package.wapproj" `
            /restore `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:GenerateAppxPackageOnBuild=true `
            /p:AppxBundle=Never `
            /p:UapAppxPackageBuildMode=SideloadOnly `
            /p:AppxPackageSigningEnabled=false

      - uses: actions/upload-artifact@v4
        with:
          name: Files-sideload-x64
          path: |
            src\Files.App (Package)\Files.Package.wapproj\AppPackages\**\*
            src\Files.App (Package)\Files.Package.wapproj\bin\**\*
